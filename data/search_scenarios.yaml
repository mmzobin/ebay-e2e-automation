# Data-driven input for the e2e shopping flow.
# Each entry becomes a separate parametrized test case.
# max_price is in the currency eBay displays for your region (e.g. ILS from Israel, USD from the US).
scenarios:
  - id: shoes_under_220
    query: shoes
    max_price: 220
    limit: 5
  - id: usb_c_cable_under_40
    query: usb c cable
    max_price: 40
    limit: 3
